apiVersion: v1
kind: Pod
metadata:
  name: app-with-sidecar
  namespace: default
spec:
  containers:
    - name: app
      image: busybox
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /var/log/app
          while true; do
            echo "$(date) - application log entry" >> /var/log/app/app.log
            sleep 5
          done
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/app
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
    - name: log-collector
      image: busybox
      command:
        - /bin/sh
        - -c
        - |
          tail -f /var/log/app/app.log
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/app
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: log-volume
      emptyDir: {}
