apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: production
  labels:
    role: backend
spec:
  containers:
    - name: backend
      image: hashicorp/http-echo:latest
      args:
        - "-text=backend"
        - "-listen=:8080"
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: production
spec:
  selector:
    role: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: production
  labels:
    role: frontend
spec:
  containers:
    - name: frontend
      image: busybox
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-pod
  namespace: production
  labels:
    role: other
spec:
  containers:
    - name: blocked
      image: busybox
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
