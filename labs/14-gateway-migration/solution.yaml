# Gateway API 마이그레이션 결과

# 1. Gateway: 리스너(포트/프로토콜/TLS) 정의
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: web
spec:
  gatewayClassName: nginx
  listeners:
    # HTTPS 리스너 (TLS 종료)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "example.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: web-tls-secret
    # HTTP 리스너 (HTTPS 리다이렉트용)
    - name: http
      port: 80
      protocol: HTTP
      hostname: "example.local"
---
# 2. HTTPRoute: URL 라우팅 규칙
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: web
spec:
  parentRefs:
    - name: web-gateway
      sectionName: https
  hostnames:
    - "example.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web-app-svc
          port: 80
---
# 3. HTTP → HTTPS 리다이렉트
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-redirect
  namespace: web
spec:
  parentRefs:
    - name: web-gateway
      sectionName: http
  hostnames:
    - "example.local"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
