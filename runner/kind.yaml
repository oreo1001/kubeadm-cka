# CKA 실습 클러스터 (kind): control-plane 1 + worker 2
# 기본 CNI를 끄고 Calico를 설치한다 (NetworkPolicy 실습용)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka
networking:
  disableDefaultCNI: true
  # A100의 docker 네트워크가 192.168.x를 써서 겹치지 않게 10.244.0.0/16
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
