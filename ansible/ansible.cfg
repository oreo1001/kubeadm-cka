[defaults]
inventory           = ./inventory/hosts.ini
remote_user         = vagrant
roles_path          = ./roles
host_key_checking   = False
retry_files_enabled = False
stdout_callback     = yaml

[ssh_connection]
ssh_args    = -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=no
pipelining  = True
