# 실제 서버 IP로 수정 후 사용
# ssh-copy-id ubuntu@<ip> 로 사전에 SSH 키 배포 필요

[master]
master ansible_host=192.168.121.10

[workers]
worker-1 ansible_host=192.168.121.11
worker-2 ansible_host=192.168.121.12

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
