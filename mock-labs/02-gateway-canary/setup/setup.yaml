apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop, version: v1 }
  template:
    metadata:
      labels: { app: shop, version: v1 }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=v1", "-listen=:5678"]
          ports:
            - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop, version: v2 }
  template:
    metadata:
      labels: { app: shop, version: v2 }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=v2", "-listen=:5678"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app-v1
  namespace: shop
spec:
  selector: { app: shop, version: v1 }
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app-v2
  namespace: shop
spec:
  selector: { app: shop, version: v2 }
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gw
  namespace: shop
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
