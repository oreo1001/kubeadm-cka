apiVersion: v1
kind: Namespace
metadata:
  name: sidecar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/log/app; while true; do date >> /var/log/app/app.log; sleep 5; done"]
