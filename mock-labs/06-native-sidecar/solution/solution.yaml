apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      initContainers:
        - name: log-tail
          image: busybox:1.36
          restartPolicy: Always          # 이 한 줄이 native sidecar를 만든다
          command: ["sh", "-c", "tail -F /var/log/app/app.log"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/log/app; while true; do date >> /var/log/app/app.log; sleep 5; done"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      volumes:
        - name: logs
          emptyDir: {}
